name: swiftdoc
description: Generate static HTML API docs for a Python project with swiftdoc.
author: kura120
branding:
  icon: book-open
  color: blue

inputs:
  version:
    description: >-
      swiftdoc release to install, such as "v0.6.0" or "0.6.0". "latest" (the
      default) uses the newest published release. Ignored with install: source.
    required: false
    default: latest
  install:
    description: >-
      "release" (default) downloads the published binary for the runner and
      verifies its SHA-256 checksum. "source" builds swiftdoc from the action's
      own checkout with cargo, which needs a Rust toolchain on the runner.
    required: false
    default: release
  src:
    description: >-
      Project directory, or a single .py file (--src). Defaults to the
      repository root, or to `src` in [tool.swiftdoc] of pyproject.toml.
    required: false
    default: ""
  out:
    description: Directory the site is written to (--out).
    required: false
    default: site
  name:
    description: >-
      Package name shown in the docs (--name). Defaults to the name in
      pyproject.toml when it configures swiftdoc, otherwise the repository name.
    required: false
    default: ""
  args:
    description: >-
      Extra swiftdoc flags, passed through as-is, for example
      "--strict --theme dark --doc-version 1.2.0". Quotes group words;
      nothing is expanded or executed.
    required: false
    default: ""
  upload-pages-artifact:
    description: >-
      "true" uploads the output directory with actions/upload-pages-artifact,
      ready for actions/deploy-pages.
    required: false
    default: "false"
  token:
    description: Token for the GitHub API lookup of the latest release.
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The swiftdoc version that was installed.
    value: ${{ steps.install.outputs.version }}
  out:
    description: The directory the site was written to.
    value: ${{ steps.run.outputs.out }}

runs:
  using: composite
  steps:
    - name: Install swiftdoc
      id: install
      shell: bash
      env:
        SWIFTDOC_INSTALL: ${{ inputs.install }}
        SWIFTDOC_VERSION: ${{ inputs.version }}
        SWIFTDOC_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action/install.sh"

    - name: Generate docs
      id: run
      shell: bash
      env:
        SWIFTDOC_SRC: ${{ inputs.src }}
        SWIFTDOC_OUT: ${{ inputs.out }}
        SWIFTDOC_NAME: ${{ inputs.name }}
        SWIFTDOC_ARGS: ${{ inputs.args }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action/run.sh"

    - name: Upload Pages artifact
      if: inputs.upload-pages-artifact == 'true'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ inputs.out }}
