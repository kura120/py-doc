# Packages the swiftdoc binary as Python wheels, published on PyPI as
# `swiftdoc` (the name `swiftdoc` is taken there). The wheels hold only the
# compiled binary, which is installed as the `swiftdoc` command: maturin names
# the executable after the Cargo bin target, not after the distribution.
# The version comes from Cargo.toml.

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "swiftdoc"
description = "A zero-config, fast Python documentation generator. Installs the swiftdoc command."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Santiago Vasquez", email = "kur4ise@gmail.com" }]
requires-python = ">=3.8"
keywords = ["documentation", "docs", "api-docs", "static-site", "docstrings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Rust",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/kura120/swiftdoc"
Repository = "https://github.com/kura120/swiftdoc"
Issues = "https://github.com/kura120/swiftdoc/issues"

[tool.maturin]
bindings = "bin"
strip = true
