name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Build and Upload (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: py-doc
            asset_name: py-doc-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: py-doc
            asset_name: py-doc-aarch64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: py-doc
            asset_name: py-doc-x86_64-apple-darwin.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: py-doc
            asset_name: py-doc-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: py-doc.exe
            asset_name: py-doc-x86_64-pc-windows-msvc.zip

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      # Release binaries are not UPX-packed: the archives are already
      # compressed, and packed executables are unsupported on macOS and
      # frequently flagged by antivirus tools on Windows.
      - name: Build Binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh ${{ matrix.target }}

      - name: Build Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: pwsh -File ./scripts/build.ps1 -Target ${{ matrix.target }}

      - name: Archive Binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          tar -czf ${{ matrix.asset_name }} -C target/${{ matrix.target }}/release ${{ matrix.artifact_name }}

      - name: Archive Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target\${{ matrix.target }}\release\${{ matrix.artifact_name }} -DestinationPath ${{ matrix.asset_name }}

      # "<hash>  <file>", the format sha256sum/shasum -c and the installers read.
      - name: Write SHA-256 checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          else
            shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          fi
          cat ${{ matrix.asset_name }}.sha256

      - name: Create and Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Python wheels for PyPI, published as `swiftdoc`. Each wheel holds only the
  # py-doc binary (maturin `bindings = "bin"`, see pyproject.toml), which pip
  # installs as the `py-doc` command. Linux wheels are built in the manylinux
  # and musllinux containers maturin-action provides.
  wheels:
    name: Wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: manylinux-x86_64
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          - os: ubuntu-latest
            platform: manylinux-aarch64
            target: aarch64-unknown-linux-gnu
            manylinux: auto
          - os: ubuntu-latest
            platform: musllinux-x86_64
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - os: ubuntu-latest
            platform: musllinux-aarch64
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          - os: macos-latest
            platform: macos-x86_64
            target: x86_64-apple-darwin
          - os: macos-latest
            platform: macos-aarch64
            target: aarch64-apple-darwin
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # Installs every wheel, and the sdist, on a machine it is meant for and runs
  # it, so a broken wheel never reaches PyPI.
  wheel-test:
    name: Test wheel (${{ matrix.platform }})
    needs: [wheels, sdist]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: manylinux-x86_64
          - os: ubuntu-24.04-arm
            platform: manylinux-aarch64
          - os: ubuntu-latest
            platform: musllinux-x86_64
            container: python:3.13-alpine
          - os: ubuntu-24.04-arm
            platform: musllinux-aarch64
            container: python:3.13-alpine
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-latest
            platform: macos-aarch64
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-latest
            platform: sdist
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: dist

      - uses: actions/setup-python@v5
        if: matrix.container == ''
        with:
          python-version: "3.x"

      # --no-index: pip may only use the wheel built above. The sdist needs
      # maturin from PyPI to build, so it is installed by path instead.
      - name: Install and run
        if: matrix.container == ''
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -ex
          if [ "$PLATFORM" = sdist ]; then
            python -m pip install dist/*.tar.gz
          else
            python -m pip install --no-index --find-links dist swiftdoc
          fi
          sh scripts/wheel-smoke-test.sh

      - name: Install and run (Alpine container)
        if: matrix.container != ''
        env:
          IMAGE: ${{ matrix.container }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w "$IMAGE" sh -c \
            'pip install --root-user-action=ignore --no-index --find-links dist swiftdoc && sh scripts/wheel-smoke-test.sh'

  # PyPI trusted publishing, so no token is stored. The PyPI project
  # `swiftdoc` trusts this file (release.yaml) running in the `pypi`
  # environment of kura120/py-doc. `publish` is needed for its check that the
  # tag matches the Cargo.toml version, which is also the wheel version.
  publish-pypi:
    name: Publish to PyPI
    needs: [publish, wheel-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/swiftdoc/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List distributions
        run: ls -l dist

      - uses: pypa/gh-action-pypi-publish@release/v1
