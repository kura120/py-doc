<nav class="sidebar" aria-label="Documentation">
    <div class="sidebar-header">
        <div class="sidebar-header-row">
            <div class="sidebar-title"><a href="{{ root_path }}index.html">{{ package.name }}</a></div>
            <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch between light and dark theme" title="Switch between light and dark theme">
                <svg class="icon-moon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M16.5 11.6A6.6 6.6 0 0 1 8.4 3.5a6.6 6.6 0 1 0 8.1 8.1Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
                <svg class="icon-sun" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="10" cy="10" r="3.4" stroke="currentColor" stroke-width="1.4"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </button>
        </div>
        <div class="version-badge">v{{ version }}</div>
    </div>

    <div class="search-box" role="search">
        <span class="search-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.4"/><path d="M16 16l-3.8-3.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>
        <input type="search" id="search-input" placeholder="Search symbols and docs..." aria-label="Search symbols and documentation" autocomplete="off" spellcheck="false">
        <kbd class="search-hint" aria-hidden="true">/</kbd>
    </div>

    <div class="nav-tree" id="nav-tree"
         data-root-path="{{ root_path }}"
         {% if module %}data-current-path="{{ module.link_path }}"{% endif %}>
    </div>
    <noscript>
        <ul class="nav-fallback">
            {% for mod in package.modules %}
                <li><a class="nav-item-link" href="{{ root_path }}{{ mod.link_path }}">{{ mod.source_path }}</a></li>
            {% endfor %}
        </ul>
    </noscript>

    <div class="theme-selector">
        <div class="theme-selector-row" id="layout-selector-row">
            <label class="selector-label" for="layout-select">Layout</label>
            <select id="layout-select">
                <option value="classic">Classic (dev-tool)</option>
                <option value="minimal">Minimal (docs.rs style)</option>
                <option value="modern">Modern (Stripe/Mintlify style)</option>
            </select>
        </div>
        <div class="theme-selector-row" id="color-theme-selector-row">
            <label class="selector-label" for="theme-select">Color theme</label>
            <select id="theme-select">
                <option value="auto">System</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                <option value="slate">Slate</option>
            </select>
        </div>
    </div>
</nav>
