# Runs `swiftdoc --strict` into a temporary directory, so a file that fails to
# parse or a doc-link, macro or image that cannot be resolved fails the commit.
#
# This hook uses the `swiftdoc` already on PATH (see the README's Installation
# section); pre-commit does not install it. Once swiftdoc ships as a Python
# wheel, this should become `language: python` so pre-commit installs it.
- id: swiftdoc
  name: swiftdoc --strict
  description: Check that swiftdoc can build the docs with no unresolved links, macros or images.
  entry: scripts/pre-commit.sh
  language: script
  files: \.py$
  pass_filenames: false
