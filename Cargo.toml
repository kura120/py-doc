[package]
name = "py-doc"
version = "0.6.0"
edition = "2024"
authors = ["Santiago Vasquez <kur4ise@gmail.com>"]
description = "A zero-config, blazing fast Python auto-documentation generator."
repository = "https://github.com/kura120/py-doc"
license = "MIT"

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
walkdir = "2.5"
ruff_python_parser = "0.0.4"
ruff_python_ast = "0.0.4"
ruff_text_size = "0.0.4"
tera = "2.0.0"
pulldown-cmark = "0.13.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
get-size2 = { version = "=0.10.1", features = ["derive", "compact-str"] }
rayon = "1.12.0"
regex = "1.13.1"

# --- Added for the interactive setup TUI ---
ratatui = "0.29"
crossterm = "0.28"
tui-input = "0.11"
indicatif = "0.17"
toml = { version = "1.2.0", default-features = false, features = ["std", "parse", "serde"] }
dunce = "1"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
tiny_http = "0.12"
ctrlc = "3.5.2"
notify = "8.2"

[package.metadata.binstall]
# Directs cargo-binstall to your GitHub Releases
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"

# Configure overrides for specific OS file formats
[package.metadata.binstall.overrides.'cfg(target_os = "windows")']
pkg-fmt = "zip"

[package.metadata.binstall.overrides.'cfg(not(target_os = "windows"))']
pkg-fmt = "tgz" # uses .tar.gz

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
